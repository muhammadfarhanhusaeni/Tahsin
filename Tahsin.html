<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tahsin Pro - Interactive Game</title>
    <!-- Import Font Arab dan Font UI Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #059669; /* Emerald Green */
            --secondary: #10b981;
            --accent: #fbbf24; /* Gold */
            --dark: #1f2937;
            --light: #f3f4f6;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .app-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            position: relative;
        }

        /* Tampilan Layar */
        .screen { display: none; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Teks Arab */
        .ayat {
            font-family: 'Amiri', serif;
            font-size: 3.5rem;
            color: var(--accent);
            margin: 20px 0;
            text-shadow: 0 4px 10px rgba(0,0,0,0.3);
            line-height: 1.5;
        }

        h1 { font-size: 2.5rem; color: var(--accent); margin-bottom: 10px; }
        p.subtitle { color: #d1d5db; font-size: 1.1rem; margin-bottom: 30px; }
        .question-text { font-size: 1.3rem; font-weight: 600; margin-bottom: 30px; line-height: 1.4; }

        /* Tombol & Pilihan */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.4);
            width: 100%;
        }
