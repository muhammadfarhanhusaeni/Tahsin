<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tahsin Al-Qur'an</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8f5e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 90%;
            max-width: 400px;
        }
        h1 {
            color: #2e7d32;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .ayat-display {
            font-size: 32px;
            font-weight: bold;
            color: #1b5e20;
            margin: 20px 0;
            font-family: 'Amiri', serif; /* Cocok untuk teks Arab */
        }
        .question {
            font-size: 16px;
            color: #333;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        button {
            padding: 12px;
            font-size: 16px;
            color: white;
            background-color: #4caf50;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #388e3c;
        }
        .score-board {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #ff9800;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>Jelajah Tajwid</h1>
    <div id="game-screen">
        <div class="ayat-display" id="ayat-text">مِنْ قَبْلُ</div>
        <div class="question" id="question-text">Hukum bacaan Nun Sukun bertemu Qaf pada ayat di atas adalah?</div>
        
        <div class="options" id="options-container">
            <!-- Tombol opsi akan di-generate oleh JS -->
        </div>
        
        <div class="score-board">Skor: <span id="score">0</span></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>Permainan Selesai!</h2>
        <p>Skor Akhir Anda: <span id="final-score">0</span> / 30</p>
        <button onclick="restartGame()">Main Lagi</button>
    </div>
</div>

<script>
    // Database Soal Tahsin & Tajwid
    const questions = [
        {
            ayat: "مِنْ قَبْلُ",
            question: "Hukum bacaan Nun Sukun bertemu Qaf pada lafaz di atas adalah?",
            options: ["Idzhar Halqi", "Ikhfa Haqiqi", "Iqlab", "Idgham Bighunnah"],
            answer: 1 // Index dari "Ikhfa Haqiqi"
        },
        {
            ayat: "مِنْ بَعْدِ",
            question: "Hukum bacaan Nun Sukun bertemu Ba' disebut?",
            options: ["Iqlab", "Idgham Bilaghunnah", "Ikhfa Syafawi", "Idzhar Syafawi"],
            answer: 0 // Index dari "Iqlab"
        },
        {
            ayat: "ء, هـ, ع, ح, غ, خ",
            question: "Huruf-huruf di atas adalah huruf yang keluar dari makhraj (tempat keluar)...",
            options: ["Asy-Syafatain (Bibir)", "Al-Jauf (Rongga Mulut)", "Al-Halq (Tenggorokan)", "Al-Lisan (Lidah)"],
            answer: 2 // Index dari "Al-Halq (Tenggorokan)"
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    const ayatText = document.getElementById("ayat-text");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const scoreText = document.getElementById("score");
    const gameScreen = document.getElementById("game-screen");
    const resultScreen = document.getElementById("result-screen");
    const finalScoreText = document.getElementById("final-score");

    function loadQuestion() {
        const currentQ = questions[currentQuestionIndex];
        ayatText.innerText = currentQ.ayat;
        questionText.innerText = currentQ.question;
        
        optionsContainer.innerHTML = "";
        currentQ.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.innerText = option;
            button.onclick = () => checkAnswer(index);
            optionsContainer.appendChild(button);
        });
    }

    function checkAnswer(selectedIndex) {
        const currentQ = questions[currentQuestionIndex];
        if (selectedIndex === currentQ.answer) {
            score += 10;
            scoreText.innerText = score;
            alert("Benar! Masya Allah.");
        } else {
            alert("Kurang tepat. Jawaban yang benar adalah: " + currentQ.options[currentQ.answer]);
        }

        currentQuestionIndex++;
        
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        gameScreen.classList.add("hidden");
        resultScreen.classList.remove("hidden");
        finalScoreText.innerText = score;
    }

    function restartGame() {
        currentQuestionIndex = 0;
        score = 0;
        scoreText.innerText = score;
        resultScreen.classList.add("hidden");
        gameScreen.classList.remove("hidden");
        loadQuestion();
    }

    // Load soal pertama saat aplikasi berjalan
    loadQuestion();
</script>

</body>
</html>
