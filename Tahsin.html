<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tahsin PID Display</title>
    <style>
        /* Desain High-Contrast khas LED/PID Screen */
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            overflow: hidden; /* Mencegah scroll di layar PID */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        
        .header {
            background-color: #1a1a1a;
            color: #00ff00;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px solid #00ff00;
        }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }

        .ayat-display {
            font-size: 80px; /* Ukuran raksasa agar terlihat dari jauh */
            color: #ffcc00;
            margin-bottom: 20px;
            font-family: 'Amiri', 'Times New Roman', serif;
            text-shadow: 2px 2px 5px rgba(255, 204, 0, 0.5);
        }

        .question {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 40px;
            max-width: 80%;
        }

        .options {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .option-box {
            background-color: #222;
            border: 2px solid #00ff00;
            color: #00ff00;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 10px;
            min-width: 250px;
        }

        .option-box span {
            background-color: #00ff00;
            color: #000;
            padding: 5px 15px;
            border-radius: 5px;
            margin-right: 15px;
        }

        /* Animasi Running Text di bawah layar */
        .running-text-container {
            background-color: #cc0000;
            color: #ffffff;
            font-size: 24px;
            font-weight: bold;
            padding: 10px 0;
            white-space: nowrap;
            overflow: hidden;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        .running-text {
            display: inline-block;
            animation: scroll-left 20s linear infinite;
        }

        @keyframes scroll-left {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }

        .hidden {
            display: none !important;
        }

        .feedback {
            font-size: 40px;
            font-weight: bold;
            margin-bottom: 20px;
        }
